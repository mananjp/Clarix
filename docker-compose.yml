services:
  db:
    image: postgres:17-alpine
    container_name: clarix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clarix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarix}
      POSTGRES_DB: ${POSTGRES_DB:-clarix}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - clarix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clarix} -d ${POSTGRES_DB:-clarix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clarix-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      USE_POSTGRES: "true"
      POSTGRES_USER: ${POSTGRES_USER:-clarix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarix}
      POSTGRES_DB: ${POSTGRES_DB:-clarix}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      ENCRYPT_AT_REST: ${ENCRYPT_AT_REST:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - clarix_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clarix_pgdata:
  clarix_data:
