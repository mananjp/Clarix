name: Deploy to Render

on:
  workflow_call:
    secrets:
      RENDER_API_KEY:
        required: true
      RENDER_SERVICE_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        id: deploy
        run: |
          echo "Triggering deploy for service ${{ secrets.RENDER_SERVICE_ID }}..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi

          DEPLOY_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy triggered successfully (ID: $DEPLOY_ID)"

      - name: Wait for deploy to finish
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::warning::No deploy ID returned, skipping wait"
            exit 0
          fi

          echo "Waiting for deploy $DEPLOY_ID to complete..."
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            sleep 10

            RESPONSE=$(curl -s \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")

            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            echo "[$ATTEMPT/$MAX_ATTEMPTS] Deploy status: $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deploy is live!"
              exit 0
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "::error::Deploy failed with status: $STATUS"
              exit 1
            fi
          done

          echo "::warning::Deploy timed out after $((MAX_ATTEMPTS * 10))s — check Render dashboard"

      - name: Verify health check
        run: |
          echo "Waiting 30s for service to stabilize..."
          sleep 30

          RENDER_URL="https://clarix-backend-0tz3.onrender.com"
          echo "Checking health at $RENDER_URL/healthz ..."

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/healthz" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done

          echo "::warning::Health check did not return 200 — verify service is running"
